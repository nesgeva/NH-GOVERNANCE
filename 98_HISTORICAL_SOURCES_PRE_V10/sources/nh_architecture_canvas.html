<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N.H — Architecture Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    background: #000000; font-family: -apple-system, "Segoe UI", sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh;
    background-color: #000;
    background-image:
      linear-gradient(rgba(255,40,50,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,40,50,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  #edges { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  #nodes { position: absolute; inset: 0; z-index: 2; }

  .node {
    position: absolute; min-width: 138px; padding: 12px 16px;
    background: radial-gradient(circle at 30% 20%, rgba(40,8,12,0.96), rgba(8,2,4,0.96));
    border: 1px solid rgba(255,60,65,0.6);
    border-radius: 9px; color: #ff9d9d; cursor: grab; user-select: none;
    font-size: 13px; font-weight: 500; line-height: 1.3;
    box-shadow: 0 0 14px rgba(255,40,50,0.18), inset 0 0 12px rgba(255,40,50,0.06);
    transition: box-shadow .18s, border-color .18s, transform .12s;
  }
  .node:hover { box-shadow: 0 0 26px rgba(255,50,60,0.5), inset 0 0 16px rgba(255,40,50,0.12);
    border-color: rgba(255,90,95,0.95); transform: translateY(-1px); z-index: 5; }
  .node:active { cursor: grabbing; }
  .node .cat { display: block; font-size: 9px; letter-spacing: 0.16em; font-weight: 400;
    text-transform: uppercase; color: rgba(255,90,90,0.5); margin-bottom: 4px; }
  .node.gate { border-color: rgba(255,120,40,0.85); color: #ffc69d;
    box-shadow: 0 0 16px rgba(255,120,40,0.25), inset 0 0 12px rgba(255,120,40,0.08); }
  .node.gate:hover { box-shadow: 0 0 28px rgba(255,130,50,0.6), inset 0 0 16px rgba(255,120,40,0.15); }
  .node.store { border-color: rgba(130,100,255,0.8); color: #c4b6ff;
    box-shadow: 0 0 16px rgba(120,90,255,0.25), inset 0 0 12px rgba(120,90,255,0.08); }
  .node.store:hover { box-shadow: 0 0 28px rgba(130,100,255,0.6), inset 0 0 16px rgba(120,90,255,0.15); }
  .node.gate .cat { color: rgba(255,140,70,0.6); }
  .node.store .cat { color: rgba(160,130,255,0.6); }
  .node .port { position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; background: rgba(255,70,70,0.95);
    cursor: crosshair; border: 2px solid #000; box-shadow: 0 0 8px rgba(255,50,60,0.7); }

  .toolbar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
    background: rgba(10,2,4,0.92); border: 1px solid rgba(255,60,65,0.4);
    border-radius: 11px; padding: 9px 13px; box-shadow: 0 0 20px rgba(255,40,50,0.15); }
  .toolbar button { background: transparent; border: 1px solid rgba(255,60,65,0.5);
    color: #ff9d9d; font-size: 12px; padding: 7px 13px; border-radius: 7px;
    cursor: pointer; letter-spacing: 0.05em; transition: background .15s; }
  .toolbar button:hover { background: rgba(255,60,65,0.2); }
  .hint { position: fixed; left: 50%; top: 20px; transform: translateX(-50%);
    color: rgba(255,80,80,0.45); font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; pointer-events: none; }
  .legend { position: fixed; left: 22px; top: 20px; font-size: 11px;
    letter-spacing: 0.05em; color: rgba(255,150,150,0.5); line-height: 1.8; pointer-events: none; }
  .legend b { font-weight: 400; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="edges"></svg>
  <div id="nodes"></div>
</div>
<div class="legend">
  <div><span class="dot" style="background:#ff4040"></span><b>core module</b></div>
  <div><span class="dot" style="background:#ff8228"></span><b>gate (approval enforced)</b></div>
  <div><span class="dot" style="background:#8264ff"></span><b>physical store</b></div>
</div>
<div class="hint">drag boxes &middot; drag the red dot to connect</div>
<div class="toolbar">
  <button id="addBtn">+ box</button>
  <button id="clearLinks">clear links</button>
  <button id="reset">reset layout</button>
</div>

<script>
const NODES = document.getElementById('nodes');
const EDGES = document.getElementById('edges');

const seed = [
  { id:'jarvis',  cat:'core',  label:'nh_jarvis_core',     cls:'',      x:90,  y:130 },
  { id:'hud',     cat:'core',  label:'nh_hud_server',      cls:'',      x:90,  y:340 },
  { id:'sandbox', cat:'core',  label:'nh_epistemic_sandbox', cls:'',    x:330, y:130 },
  { id:'simgraph',cat:'core',  label:'nh_simulation_graph', cls:'',     x:330, y:340 },
  { id:'simstore',cat:'store', label:'.nh_simulation_store', cls:'store', x:330, y:520 },
  { id:'router',  cat:'core',  label:'nh_context_router',  cls:'gate',  x:600, y:130 },
  { id:'promote', cat:'gate',  label:'promote_to_memory',  cls:'gate',  x:600, y:300 },
  { id:'research',cat:'core',  label:'nh_research_engine', cls:'',      x:600, y:470 },
  { id:'gatekeep',cat:'gate',  label:'ResearchGatekeeper', cls:'gate',  x:600, y:620 },
  { id:'memstore',cat:'store', label:'.nh_memory_store',   cls:'store', x:900, y:300 },
  { id:'vector',  cat:'core',  label:'nh_vector_memory',   cls:'',      x:900, y:130 },
  { id:'reality', cat:'core',  label:'nh_reality_graph',   cls:'',      x:900, y:470 }
];
const seedLinks = [
  ['sandbox','simgraph'], ['simgraph','simstore'], ['simgraph','promote'],
  ['promote','memstore'], ['router','promote'], ['research','gatekeep'],
  ['gatekeep','promote'], ['vector','reality'], ['jarvis','hud'], ['hud','router']
];

let nodes = [], links = [], nodeEls = {};
const clone = a => JSON.parse(JSON.stringify(a));

function build() {
  NODES.innerHTML = ''; nodeEls = {};
  for (const n of nodes) {
    const el = document.createElement('div');
    el.className = 'node ' + (n.cls || '');
    el.style.left = n.x+'px'; el.style.top = n.y+'px';
    el.innerHTML = '<span class="cat">'+n.cat+'</span>'+n.label+'<div class="port"></div>';
    NODES.appendChild(el); nodeEls[n.id] = el;
    makeDraggable(el, n);
    el.querySelector('.port').addEventListener('mousedown', e => startLink(e, n));
  }
  drawEdges();
}
function center(n){ const el=nodeEls[n.id]; return { x:n.x+el.offsetWidth/2, y:n.y+el.offsetHeight/2 }; }

function drawEdges(tmp) {
  let s = '';
  for (const pair of links) {
    const na=nodes.find(n=>n.id===pair[0]), nb=nodes.find(n=>n.id===pair[1]);
    if(!na||!nb) continue;
    const ca=center(na), cb=center(nb);
    const mx=(ca.x+cb.x)/2;
    s += '<path d="M'+ca.x+','+ca.y+' C'+mx+','+ca.y+' '+mx+','+cb.y+' '+cb.x+','+cb.y+'" fill="none" stroke="rgba(255,55,60,0.4)" stroke-width="1.5"/>';
  }
  if (tmp) s += '<line x1="'+tmp.x1+'" y1="'+tmp.y1+'" x2="'+tmp.x2+'" y2="'+tmp.y2+'" stroke="rgba(255,90,90,0.85)" stroke-width="1.5" stroke-dasharray="5 5"/>';
  EDGES.innerHTML = s;
}

function makeDraggable(el, n) {
  el.addEventListener('mousedown', e => {
    if (e.target.classList.contains('port')) return;
    const ox=e.clientX-n.x, oy=e.clientY-n.y;
    function move(ev){ n.x=ev.clientX-ox; n.y=ev.clientY-oy; el.style.left=n.x+'px'; el.style.top=n.y+'px'; drawEdges(); }
    function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}

let linking=null;
function startLink(e, n) {
  e.stopPropagation();
  const c=center(n); linking={from:n.id,x1:c.x,y1:c.y};
  function move(ev){ drawEdges({x1:linking.x1,y1:linking.y1,x2:ev.clientX,y2:ev.clientY}); }
  function up(ev){
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    const t=document.elementFromPoint(ev.clientX,ev.clientY);
    const box=t&&t.closest('.node');
    if(box){ const tid=Object.keys(nodeEls).find(k=>nodeEls[k]===box);
      if(tid&&tid!==linking.from&&!links.some(l=>l[0]===linking.from&&l[1]===tid)) links.push([linking.from,tid]); }
    linking=null; drawEdges();
  }
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

let addCount=0;
document.getElementById('addBtn').onclick=function(){ addCount++;
  const label=prompt('Box name:','new_module'); if(!label) return;
  nodes.push({id:'new'+addCount,cat:'custom',label:label,cls:'',x:140+addCount*28,y:140+addCount*28}); build(); };
document.getElementById('clearLinks').onclick=function(){ links=[]; drawEdges(); };
document.getElementById('reset').onclick=function(){ init(); };

function init(){ nodes=clone(seed); links=clone(seedLinks); build(); }
init();
window.addEventListener('resize', drawEdges);
</script>
</body>
</html>
